[package]
name = "ryu-ugc"
version = "0.2.2"
edition = "2021"
license = "Apache-2.0"
description = "UGC: the creator-marketing campaign tracker for Ryu — campaigns, a creator roster, post submissions with review, metric snapshots and integer-cent payout accrual (engine + SQLite store + HTTP surface). Post metrics use a curated platform -> Composio action map executed through Ryu's managed Gateway provider router."
repository = "https://github.com/amajorai/ryu"

# The out-of-process sidecar binary. Core spawns it (`kind: local`, sibling on
# PATH / `RYU_UGC_BIN`), health-checks it, and proxies `/api/ugc/*` to it on
# loopback — exactly like `ryu-quests` / `ryu-monitors`. This bin is just the
# process shell around the crate's `routes()` + `UgcEngine`; the desktop dock
# panel reaches it through the manifest's `http.public_mount`.
[[bin]]
name = "ryu-ugc"
path = "src/main.rs"

# Versions are matched to apps/core/Cargo.toml so an in-process merge into Core's
# axum router has no version skew. This crate has ZERO dependency on apps/core.
[dependencies]
ryu-sidecar-runtime = { path = "../crates/core/sidecar-runtime", version = "0.2.2" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
tracing = "0.1"
async-trait = "0.1"
# Parses `submissions.post_url` into the platform-native post id — the ONE
# dynamic value this app ever hands to a Composio action.
url = "2"
# Raises this app's declared `hook_events` (manifest `contributes.hook_events`)
# so other plugins/workflows can react to a submission being approved or a payout
# accruing. This is the fan-out path: `notify.fanout` is pinned to `@ryu/monitors`
# Core-side and 403s every other caller, whereas `events.emit` is authorized by
# ownership of the event id. Emit-only and best-effort: it no-ops when the process
# is not Core-hosted, so the standalone bin and this crate's own tests are
# unaffected.
ryu-app-events = { path = "../crates/core/app-events", version = "0.2.2" }
# Sidecar-binary-only deps (data-dir resolution + logging), mirroring
# `ryu-quests` / `ryu-monitors`. Core already pulls all of these, so there is no
# new dependency in the in-process build.
dirs = "5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
